<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#071827"
>

<title>Muwahad's Portfolio — Splash</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --cream: #f5f1e8;
    --cream2: #ebe4d6;

    --gold: #b88632;
    --gold-light: #d7ad5b;
    --gold-bright: #f0cf83;

    --navy: #071827;
    --navy2: #0c2235;
    --navy3: #122d43;

    --white: #ffffff;

    --world-size: min(78vw, 78vh, 620px);

    --core-size: clamp(82px, 12vw, 155px);

    --brand-size: clamp(
        22px,
        4.4vw,
        46px
    );

    --logo-size: clamp(
        56px,
        7vw,
        72px
    );

    --loader-width: min(
        280px,
        calc(100vw - 48px)
    );
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    width: 100%;
    min-height: 100%;
    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


body {
    width: 100%;
    min-height: 100dvh;

    overflow: hidden;

    background: var(--cream);

    font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}


/* =========================================================
   SPLASH
========================================================= */

.splash {

    position: fixed;

    inset: 0;

    z-index: 9999;

    width: 100%;
    height: 100dvh;

    min-height: 100svh;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(184,134,50,.16),
            transparent 22%
        ),

        radial-gradient(
            circle at 50% 50%,
            #10283b 0%,
            #071827 38%,
            #04111d 72%,
            #02080e 100%
        );

    transition:
        opacity 1.4s cubic-bezier(.77,0,.18,1),
        transform 1.4s cubic-bezier(.77,0,.18,1);
}


.splash.hide {

    opacity: 0;

    transform: scale(1.18);

    pointer-events: none;
}


/* =========================================================
   CANVAS
========================================================= */

#particles {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.glow {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(70vw, 600px);

    height:
        min(70vw, 600px);

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(184,134,50,.17),
            rgba(184,134,50,.05) 35%,
            transparent 70%
        );

    filter: blur(15px);

    animation:
        glowPulse 4s ease-in-out infinite alternate;

    pointer-events: none;

    z-index: 2;
}


@keyframes glowPulse {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.85);

        opacity: .55;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1.2);

        opacity: 1;
    }
}


/* =========================================================
   TOP / BOTTOM DECORATION
========================================================= */

.top-line,
.bottom-line {

    position: absolute;

    left: 50%;

    width: 1px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(215,173,91,.5),
            transparent
        );

    opacity: .6;

    z-index: 3;
}


.top-line {

    top: 0;

    height:
        clamp(70px, 17vh, 180px);
}


.bottom-line {

    bottom: 0;

    height:
        clamp(70px, 17vh, 180px);
}


/* =========================================================
   3D WORLD
========================================================= */

.world {

    position: relative;

    flex: 0 0 auto;

    width: var(--world-size);
    height: var(--world-size);

    max-width: 620px;
    max-height: 620px;

    perspective:
        clamp(
            700px,
            12vw,
            1300px
        );

    transform-style: preserve-3d;

    transform:
        rotateX(var(--mouseY, 0deg))
        rotateY(var(--mouseX, 0deg));

    transition:
        transform .25s ease-out;

    z-index: 5;

    animation:
        worldIntro
        2.2s
        cubic-bezier(.16,1,.3,1);
}


@keyframes worldIntro {

    0% {

        opacity: 0;

        transform:
            scale(.1)
            rotateX(75deg)
            rotateY(70deg);
    }

    55% {

        opacity: 1;

        transform:
            scale(1.08)
            rotateX(-8deg)
            rotateY(-10deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotateX(0deg)
            rotateY(0deg);
    }
}


/* =========================================================
   GOLD 3D RINGS
========================================================= */

.ring {

    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    border:
        1px solid
        rgba(215,173,91,.65);

    transform-style: preserve-3d;

    box-shadow:
        0 0 15px rgba(184,134,50,.25),
        inset 0 0 15px rgba(184,134,50,.1);
}


.ring::before,
.ring::after {

    content: "";

    position: absolute;

    width:
        clamp(5px, .7vw, 8px);

    height:
        clamp(5px, .7vw, 8px);

    border-radius: 50%;

    background:
        var(--gold-bright);

    box-shadow:
        0 0 8px var(--gold-light),
        0 0 22px var(--gold),
        0 0 45px rgba(184,134,50,.8);
}


/* =========================================================
   RING SIZES
========================================================= */

.ring.one {

    width: 46.7%;
    height: 46.7%;

    min-width: 150px;
    min-height: 150px;

    transform:
        translate(-50%,-50%)
        rotateX(70deg);

    animation:
        ringOne
        7s
        linear
        infinite;
}


.ring.one::before {

    left: 50%;
    top: -4px;
}


.ring.two {

    width: 58.3%;
    height: 58.3%;

    min-width: 185px;
    min-height: 185px;

    border-color:
        rgba(255,255,255,.2);

    transform:
        translate(-50%,-50%)
        rotateY(70deg)
        rotateZ(20deg);

    animation:
        ringTwo
        10s
        linear
        infinite;
}


.ring.two::after {

    right: 12%;
    bottom: 15%;
}


.ring.three {

    width: 71.7%;
    height: 71.7%;

    min-width: 220px;
    min-height: 220px;

    border-color:
        rgba(215,173,91,.25);

    transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateY(25deg);

    animation:
        ringThree
        14s
        linear
        infinite;
}


.ring.four {

    width: 38.3%;
    height: 38.3%;

    min-width: 125px;
    min-height: 125px;

    border-color:
        rgba(240,207,131,.45);

    transform:
        translate(-50%,-50%)
        rotateY(75deg)
        rotateX(30deg);

    animation:
        ringFour
        6s
        linear
        infinite
        reverse;
}


/* =========================================================
   RING ANIMATIONS
========================================================= */

@keyframes ringOne {

    from {

        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(360deg);
    }
}


@keyframes ringTwo {

    from {

        transform:
            translate(-50%,-50%)
            rotateY(70deg)
            rotateZ(20deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateY(70deg)
            rotateZ(380deg);
    }
}


@keyframes ringThree {

    from {

        transform:
            translate(-50%,-50%)
            rotateX(65deg)
            rotateY(25deg)
            rotateZ(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateX(65deg)
            rotateY(25deg)
            rotateZ(360deg);
    }
}


@keyframes ringFour {

    from {

        transform:
            translate(-50%,-50%)
            rotateY(75deg)
            rotateX(30deg)
            rotateZ(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateY(75deg)
            rotateX(30deg)
            rotateZ(360deg);
    }
}


/* =========================================================
   CENTRAL GOLD CORE
========================================================= */

.core {

    position: absolute;

    left: 50%;
    top: 50%;

    width: var(--core-size);
    height: var(--core-size);

    transform:
        translate(-50%,-50%)
        translateZ(90px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff6d7 0%,
            #f0cf83 8%,
            #d7ad5b 20%,
            #b88632 38%,
            #704816 62%,
            #27190a 83%,
            #080503 100%
        );

    box-shadow:

        0 0 20px
            rgba(240,207,131,.8),

        0 0 55px
            rgba(184,134,50,.65),

        0 0 100px
            rgba(184,134,50,.35),

        0 0 160px
            rgba(184,134,50,.15),

        inset -25px -30px 45px
            rgba(0,0,0,.75);

    z-index: 10;

    transform-style: preserve-3d;

    animation:
        coreFloat
        4s
        ease-in-out
        infinite,

        coreLight
        2.5s
        ease-in-out
        infinite
        alternate;
}


.core::before {

    content: "";

    position: absolute;

    inset:
        clamp(8px, 1.2vw, 13px);

    border-radius: 50%;

    border:
        1px solid
        rgba(255,244,205,.8);

    box-shadow:

        inset 0 0 25px
            rgba(255,240,190,.45),

        0 0 20px
            rgba(255,220,130,.3);
}


.core::after {

    content: "";

    position: absolute;

    inset:
        clamp(-55px, -7vw, -35px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(184,134,50,.35),
            transparent 65%
        );

    filter: blur(20px);

    z-index: -1;
}


@keyframes coreFloat {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            translateZ(80px)
            rotateX(0deg)
            rotateY(0deg);
    }

    50% {

        transform:
            translate(-50%,-58%)
            translateZ(110px)
            rotateX(12deg)
            rotateY(-12deg);
    }
}


@keyframes coreLight {

    from {
        filter: brightness(.85);
    }

    to {
        filter: brightness(1.35);
    }
}


/* =========================================================
   ORBITS
========================================================= */

.orbit {

    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    transform-style: preserve-3d;
}


.orbit span {

    position: absolute;

    width:
        clamp(6px, .8vw, 9px);

    height:
        clamp(6px, .8vw, 9px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff8dd,
            var(--gold)
        );

    box-shadow:

        0 0 8px #fff2bd,

        0 0 20px var(--gold-light),

        0 0 45px var(--gold);
}


.orbit.a {

    width: 76.7%;
    height: 76.7%;

    min-width: 240px;
    min-height: 240px;

    transform:
        translate(-50%,-50%);

    animation:
        orbitA
        7s
        linear
        infinite;
}


.orbit.a span {

    top: -5px;
    left: 50%;
}


.orbit.b {

    width: 58.3%;
    height: 58.3%;

    min-width: 185px;
    min-height: 185px;

    transform:
        translate(-50%,-50%);

    animation:
        orbitB
        5s
        linear
        infinite
        reverse;
}


.orbit.b span {

    right: -5px;
    top: 30%;
}


.orbit.c {

    width: 85%;
    height: 85%;

    min-width: 265px;
    min-height: 265px;

    transform:
        translate(-50%,-50%);

    animation:
        orbitC
        12s
        linear
        infinite;
}


.orbit.c span {

    bottom: -5px;
    left: 15%;
}


/* =========================================================
   ORBIT ANIMATIONS
========================================================= */

@keyframes orbitA {

    to {

        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(360deg);
    }
}


@keyframes orbitB {

    to {

        transform:
            translate(-50%,-50%)
            rotateY(70deg)
            rotateZ(360deg);
    }
}


@keyframes orbitC {

    to {

        transform:
            translate(-50%,-50%)
            rotateX(60deg)
            rotateY(30deg)
            rotateZ(360deg);
    }
}


/* =========================================================
   CENTER LOGO
========================================================= */

.logo {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        translateZ(170px);

    width:
        min(90%, 560px);

    z-index: 30;

    text-align: center;

    pointer-events: none;
}


/* =========================================================
   LOGO SYMBOL
========================================================= */

.logo-symbol {

    width: var(--logo-size);
    height: var(--logo-size);

    margin:
        0 auto clamp(10px, 1.8vw, 18px);

    border-radius:
        clamp(14px, 2vw, 18px);

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.28),
            rgba(255,255,255,.04)
        );

    border:
        1px solid
        rgba(240,207,131,.6);

    box-shadow:

        0 12px 50px
            rgba(184,134,50,.5),

        inset 0 1px 2px
            rgba(255,255,255,.7);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    animation:
        symbolReveal
        1.5s
        cubic-bezier(.16,1,.3,1)
        .8s
        backwards;
}


.logo-symbol span {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(30px, 4.2vw, 43px);

    font-weight: bold;

    color:
        var(--gold-bright);

    text-shadow:

        0 0 8px
            rgba(240,207,131,.7),

        0 0 25px
            rgba(184,134,50,.8);
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        var(--brand-size);

    font-weight: bold;

    letter-spacing:
        clamp(4px, 1vw, 10px);

    line-height: 1.15;

    color:
        var(--cream);

    white-space: nowrap;

    text-shadow:

        0 2px 8px
            rgba(0,0,0,.8),

        0 0 25px
            rgba(184,134,50,.35);

    animation:
        brandReveal
        1.8s
        cubic-bezier(.16,1,.3,1)
        1.2s
        backwards;
}


.tagline {

    margin-top:
        clamp(8px, 1.4vw, 13px);

    font-size:
        clamp(6px, 1vw, 9px);

    letter-spacing:
        clamp(2px, .8vw, 7px);

    line-height: 1.4;

    color:
        rgba(240,207,131,.75);

    animation:
        taglineReveal
        1.4s
        ease
        2.3s
        backwards;
}


/* =========================================================
   LOGO ANIMATIONS
========================================================= */

@keyframes symbolReveal {

    from {

        opacity: 0;

        transform:
            translateY(50px)
            scale(.2)
            rotateX(80deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }
}


@keyframes brandReveal {

    from {

        opacity: 0;

        letter-spacing: 35px;

        filter: blur(20px);

        transform:
            translateY(30px);
    }

    to {

        opacity: 1;

        letter-spacing:
            clamp(4px, 1vw, 10px);

        filter: blur(0);

        transform:
            translateY(0);
    }
}


@keyframes taglineReveal {

    from {

        opacity: 0;

        letter-spacing: 20px;
    }

    to {

        opacity: 1;

        letter-spacing:
            clamp(2px, .8vw, 7px);
    }
}


/* =========================================================
   SIDE HUD
========================================================= */

.hud {

    position: absolute;

    inset:
        clamp(14px, 2.2vw, 28px);

    pointer-events: none;

    opacity: .6;

    z-index: 8;
}


.corner {

    position: absolute;

    width:
        clamp(32px, 4vw, 50px);

    height:
        clamp(32px, 4vw, 50px);

    border:
        1px solid
        rgba(215,173,91,.35);
}


.corner.tl {

    top: 0;
    left: 0;

    border-right: 0;
    border-bottom: 0;
}


.corner.tr {

    top: 0;
    right: 0;

    border-left: 0;
    border-bottom: 0;
}


.corner.bl {

    bottom: 0;
    left: 0;

    border-right: 0;
    border-top: 0;
}


.corner.br {

    bottom: 0;
    right: 0;

    border-left: 0;
    border-top: 0;
}


.hud-text {

    position: absolute;

    font-size:
        clamp(5px, .7vw, 7px);

    letter-spacing:
        clamp(1.5px, .35vw, 3px);

    color:
        rgba(240,207,131,.45);

    white-space: nowrap;
}


.hud-top {

    top:
        clamp(7px, 1vw, 10px);

    left:
        clamp(45px, 5vw, 65px);
}


.hud-bottom {

    right:
        clamp(45px, 5vw, 65px);

    bottom:
        clamp(7px, 1vw, 10px);
}


/* =========================================================
   LOADER
========================================================= */

.loader {

    position: absolute;

    left: 50%;

    bottom:
        max(
            env(safe-area-inset-bottom),
            clamp(35px, 6vh, 62px)
        );

    transform:
        translateX(-50%);

    width:
        var(--loader-width);

    max-width:
        calc(100vw - 48px);

    text-align: center;

    z-index: 100;
}


.loader-title {

    font-size:
        clamp(7px, 1vw, 9px);

    letter-spacing:
        clamp(2px, .6vw, 4px);

    line-height: 1.4;

    color:
        rgba(245,241,232,.55);

    margin-bottom:
        clamp(8px, 1.5vw, 12px);

    animation:
        blink
        1.3s
        ease-in-out
        infinite
        alternate;
}


.loader-bar {

    position: relative;

    width: 100%;

    height:
        clamp(2px, .3vw, 3px);

    background:
        rgba(255,255,255,.12);

    overflow: hidden;

    border-radius: 10px;
}


.loader-progress {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            var(--gold-bright),
            var(--gold),
            transparent
        );

    box-shadow:
        0 0 12px var(--gold-light),
        0 0 25px var(--gold);

    animation:
        progress
        6.8s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.loader-percent {

    margin-top:
        clamp(6px, 1vw, 9px);

    font-size:
        clamp(6px, .8vw, 8px);

    letter-spacing:
        clamp(1.5px, .5vw, 3px);

    color:
        rgba(240,207,131,.5);
}


@keyframes progress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}


@keyframes blink {

    from {
        opacity: .3;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   HOME
========================================================= */

.home {

    position: relative;

    width: 100%;

    height: 100dvh;

    min-height: 100svh;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

    background:
        linear-gradient(
            135deg,
            var(--cream),
            #ffffff
        );

    color: var(--navy);

    opacity: 0;

    transform:
        scale(.96);

    transition:
        opacity 1.4s ease,
        transform 1.4s ease;
}


.home.show {

    opacity: 1;

    transform:
        scale(1);
}


.home-content {

    width:
        min(100%, 900px);

    text-align: center;

    overflow-wrap: break-word;
}


.home-content small {

    display: block;

    font-size:
        clamp(
            14px,
            2.2vw,
            20px
        );

    font-weight: 600;

    letter-spacing:
        clamp(
            3px,
            1vw,
            7px
        );

    line-height: 1.4;

    color:
        var(--gold);
}


.home-content h1 {

    margin:
        clamp(8px, 1.5vw, 12px)
        0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            30px,
            5vw,
            65px
        );

    font-weight: 700;

    letter-spacing:
        clamp(
            2px,
            .8vw,
            6px
        );

    line-height: 1.12;

    color:
        var(--navy);

    overflow-wrap: break-word;
}


.home-content p {

    max-width:
        700px;

    margin:
        0 auto;

    font-size:
        clamp(
            12px,
            1.5vw,
            16px
        );

    line-height: 1.6;

    color:
        rgba(7,24,39,.6);

    letter-spacing:
        clamp(
            1px,
            .35vw,
            2px
        );
}


.home-content button {

    margin-top:
        clamp(20px, 3vw, 30px);

    padding:
        clamp(11px, 1.5vw, 14px)
        clamp(22px, 3vw, 30px);

    border: 0;

    border-radius:
        clamp(7px, 1vw, 8px);

    background:
        var(--navy);

    color:
        var(--cream);

    cursor: pointer;

    font-size:
        clamp(10px, 1vw, 13px);

    letter-spacing:
        clamp(1px, .4vw, 2px);

    box-shadow:
        0 10px 30px
        rgba(7,24,39,.2);

    transition:
        .3s ease;
}


.home-content button:hover {

    background:
        var(--gold);

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 35px
        rgba(184,134,50,.3);
}


.home-content button:focus-visible {

    outline:
        2px solid
        var(--gold);

    outline-offset: 4px;
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 480px) {

    :root {

        --world-size:
            min(
                88vw,
                58vh,
                410px
            );
    }


    .brand {

        white-space: normal;

        font-size:
            clamp(
                20px,
                7vw,
                30px
            );

        letter-spacing:
            clamp(
                3px,
                1.3vw,
                6px
            );

        line-height: 1.1;
    }


    .tagline {

        font-size: 6px;

        letter-spacing:
            clamp(
                2px,
                1vw,
                4px
            );
    }


    .loader {

        width:
            min(
                210px,
                calc(100vw - 48px)
            );
    }


    .hud-text {

        display: none;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 360px) {

    :root {

        --world-size:
            min(
                88vw,
                52vh,
                340px
            );
    }


    .ring.one {

        min-width: 125px;
        min-height: 125px;
    }


    .ring.two {

        min-width: 155px;
        min-height: 155px;
    }


    .ring.three {

        min-width: 190px;
        min-height: 190px;
    }


    .ring.four {

        min-width: 105px;
        min-height: 105px;
    }


    .orbit.a {

        min-width: 205px;
        min-height: 205px;
    }


    .orbit.b {

        min-width: 155px;
        min-height: 155px;
    }


    .orbit.c {

        min-width: 235px;
        min-height: 235px;
    }


    .loader {

        bottom:
            max(
                env(safe-area-inset-bottom),
                30px
            );
    }
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width: 481px) and (max-width: 1024px) {

    :root {

        --world-size:
            min(
                70vw,
                70vh,
                560px
            );
    }
}


/* =========================================================
   SHORT SCREEN / LANDSCAPE
========================================================= */

@media (max-height: 600px) {

    :root {

        --world-size:
            min(
                60vh,
                70vw,
                430px
            );
    }


    .loader {

        bottom:
            max(
                env(safe-area-inset-bottom),
                20px
            );
    }


    .logo-symbol {

        margin-bottom: 7px;
    }


    .tagline {

        margin-top: 5px;
    }
}


/* =========================================================
   VERY SHORT LANDSCAPE MOBILE
========================================================= */

@media (
    max-height: 450px
) and (
    orientation: landscape
) {

    :root {

        --world-size:
            min(
                75vh,
                65vw,
                360px
            );
    }


    .loader {

        bottom: 12px;

        width:
            min(
                180px,
                calc(100vw - 40px)
            );
    }


    .loader-title {

        margin-bottom: 5px;
    }


    .loader-percent {

        margin-top: 4px;
    }


    .hud {

        inset: 10px;
    }
}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media (min-width: 1600px) {

    :root {

        --world-size:
            min(
                620px,
                70vh
            );
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     SPLASH
===================================================== -->

<section
    class="splash"
    id="splash"
>


    <!-- PARTICLES -->

    <canvas
        id="particles"
    ></canvas>


    <!-- AMBIENT LIGHT -->

    <div class="glow"></div>


    <!-- DECORATION -->

    <div class="top-line"></div>

    <div class="bottom-line"></div>


    <!-- HUD -->

    <div class="hud">

        <div class="corner tl"></div>

        <div class="corner tr"></div>

        <div class="corner bl"></div>

        <div class="corner br"></div>


        <div class="hud-text hud-top">
            PORTFOLIO // SYSTEM
        </div>


        <div class="hud-text hud-bottom">
            DESIGN • CODE • CREATE
        </div>

    </div>


    <!-- =================================================
         3D WORLD
    ================================================= -->

    <div
        class="world"
        id="world"
    >


        <!-- RINGS -->

        <div class="ring one"></div>

        <div class="ring two"></div>

        <div class="ring three"></div>

        <div class="ring four"></div>


        <!-- ORBITS -->

        <div class="orbit a">
            <span></span>
        </div>


        <div class="orbit b">
            <span></span>
        </div>


        <div class="orbit c">
            <span></span>
        </div>


        <!-- CORE -->

        <div class="core"></div>


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-symbol">
                <span>M</span>
            </div>


            <div class="brand">
                MUWAHAD'S
            </div>


            <div class="tagline">
                PORTFOLIO
            </div>

        </div>

    </div>


    <!-- =================================================
         LOADER
    ================================================= -->

    <div class="loader">

        <div class="loader-title">
            CRAFTING DIGITAL EXPERIENCE
        </div>


        <div class="loader-bar">

            <div
                class="loader-progress"
                id="progress"
            ></div>

        </div>


        <div
            class="loader-percent"
            id="percent"
        >
            0%
        </div>

    </div>


</section>


<!-- =====================================================
     HOME
===================================================== -->

<main
    class="home"
    id="home"
>

    <div class="home-content">

        <small>
            A VISION
        </small>


        <h1>
            BEYOND ORDINARY
        </h1>


        <p>
            Graphic Design • Motion • Web • Creative
        </p>


        <button
            type="button"
            id="explorePortfolio"
        >
            EXPLORE PORTFOLIO
        </button>

    </div>

</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

const world =
    document.getElementById("world");

const splash =
    document.getElementById("splash");

const home =
    document.getElementById("home");

const explorePortfolio =
    document.getElementById("explorePortfolio");

explorePortfolio.addEventListener(
    "click",
    () => {

        window.location.href = "index.html";

    }
);

const percent =
    document.getElementById("percent");


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

let width = window.innerWidth;

let height = window.innerHeight;

let particles = [];

let animationFrame;


/* =========================================================
   DEVICE PIXEL RATIO
========================================================= */

function getDPR() {

    return Math.min(
        window.devicePixelRatio || 1,
        2
    );

}


/* =========================================================
   PARTICLE COUNT
========================================================= */

function getParticleCount() {

    const area =
        window.innerWidth *
        window.innerHeight;

    if (window.innerWidth <= 480) {

        return 60;

    }

    if (window.innerWidth <= 1024) {

        return 100;

    }

    if (area >= 3000000) {

        return 190;

    }

    return 150;

}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const dpr =
        getDPR();


    canvas.width =
        Math.floor(width * dpr);

    canvas.height =
        Math.floor(height * dpr);


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    /*
       Important:
       Reset transform before scaling.
       This prevents repeated resize scaling.
    */

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    createParticles();

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* =========================================================
   CREATE PARTICLES
========================================================= */

function createParticles() {

    particles = [];

    const count =
        getParticleCount();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        particles.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            size:
                .4 +
                Math.random() *
                2.2,

            speedX:
                (Math.random() - .5) *
                .25,

            speedY:
                (Math.random() - .5) *
                .25,

            alpha:
                .15 +
                Math.random() *
                .65,

            gold:
                Math.random() >
                .25

        });

    }

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for (
        const p of particles
    ) {

        p.x += p.speedX;

        p.y += p.speedY;


        if (
            p.x < -5
        ) {

            p.x = width + 5;

        }


        if (
            p.x > width + 5
        ) {

            p.x = -5;

        }


        if (
            p.y < -5
        ) {

            p.y = height + 5;

        }


        if (
            p.y > height + 5
        ) {

            p.y = -5;

        }


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        if (p.gold) {

            ctx.fillStyle =
                `rgba(
                    215,
                    173,
                    91,
                    ${p.alpha}
                )`;

            ctx.shadowColor =
                "rgba(184,134,50,.7)";

        } else {

            ctx.fillStyle =
                `rgba(
                    245,
                    241,
                    232,
                    ${p.alpha * .55}
                )`;

            ctx.shadowColor =
                "rgba(255,255,255,.3)";

        }


        ctx.shadowBlur = 8;

        ctx.fill();

    }


    animationFrame =
        requestAnimationFrame(
            drawParticles
        );

}


drawParticles();


/* =========================================================
   3D PARALLAX
========================================================= */

let targetX = 0;

let targetY = 0;

let currentX = 0;

let currentY = 0;


function updateWorldRotation() {

    currentX +=
        (targetX - currentX) *
        .08;

    currentY +=
        (targetY - currentY) *
        .08;


    world.style.setProperty(
        "--mouseX",
        currentX + "deg"
    );


    world.style.setProperty(
        "--mouseY",
        currentY + "deg"
    );


    requestAnimationFrame(
        updateWorldRotation
    );

}


updateWorldRotation();


/* =========================================================
   MOUSE PARALLAX
========================================================= */

window.addEventListener(
    "mousemove",
    event => {

        if (
            window.innerWidth <= 700
        ) {

            return;

        }


        targetX =
            (
                event.clientX /
                window.innerWidth
                - .5
            ) * 14;


        targetY =
            (
                event.clientY /
                window.innerHeight
                - .5
            ) * -14;

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH PARALLAX
========================================================= */

window.addEventListener(
    "touchmove",
    event => {

        if (
            !event.touches.length
        ) {

            return;

        }


        const touch =
            event.touches[0];


        targetX =
            (
                touch.clientX /
                window.innerWidth
                - .5
            ) * 10;


        targetY =
            (
                touch.clientY /
                window.innerHeight
                - .5
            ) * -10;

    },
    {
        passive: true
    }
);


/* =========================================================
   RESET PARALLAX
========================================================= */

window.addEventListener(
    "mouseleave",
    () => {

        targetX = 0;

        targetY = 0;

    }
);


/* =========================================================
   LOADING
========================================================= */

const start =
    performance.now();


const duration =
    6800;


let splashFinished =
    false;


function updateProgress(time) {

    if (splashFinished) {

        return;

    }


    const elapsed =
        time - start;


    const progress =
        Math.min(
            elapsed / duration,
            1
        );


    const value =
        Math.floor(
            progress * 100
        );


    percent.textContent =
        value + "%";


    if (
        progress < 1
    ) {

        requestAnimationFrame(
            updateProgress
        );

    } else {

        percent.textContent =
            "100%";


        finishSplash();

    }

}


requestAnimationFrame(
    updateProgress
);


/* =========================================================
   FINISH SPLASH
========================================================= */

function finishSplash() {

    if (splashFinished) {

        return;

    }


    splashFinished = true;


    splash.classList.add(
        "hide"
    );


    home.classList.add(
        "show"
    );


    setTimeout(
        () => {

            splash.style.display =
                "none";

        },
        1500
    );

}


/* =========================================================
   ESCAPE = SKIP
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            finishSplash();

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );

        }

    }
);

</script>

</body>
</html>
