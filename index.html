 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF8F5" />

    <title>Danish Ali — Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fbf8f5;
            overflow-x: hidden;
        }

        /* =====================================================
           PAGE FRAMES
        ===================================================== */

        .page-frame {
            display: block;
            width: 100%;
            min-height: 100px;
            height: 100vh;

            border: 0;
            margin: 0;
            padding: 0;

            overflow: hidden;
            vertical-align: top;
        }

        /* =====================================================
           BACK TO TOP
        ===================================================== */

        .back-to-top {
            position: fixed;

            right: 24px;
            bottom: 24px;

            z-index: 999999;

            width: 46px;
            height: 46px;

            border: 1px solid rgba(196, 145, 78, 0.55);
            border-radius: 50%;

            background: #05121d;
            color: #deb680;

            font-size: 23px;
            line-height: 1;

            cursor: pointer;

            opacity: 0;
            visibility: hidden;

            transform: translateY(12px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                visibility 0.25s ease;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background: #0a2231;
            transform: translateY(-3px);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {
            .back-to-top {
                right: 16px;
                bottom: 16px;

                width: 42px;
                height: 42px;

                font-size: 20px;
            }
        }


        /* Splash screen */
:root {
    --cream: #f5f1e8;
    --cream2: #ebe4d6;

    --gold: #b88632;
    --gold-light: #d7ad5b;
    --gold-bright: #f0cf83;

    --navy: #071827;
    --navy2: #0c2235;
    --navy3: #122d43;

    --white: #ffffff;

    --world-size: min(78vw, 78vh, 620px);

    --core-size: clamp(82px, 12vw, 155px);

    --brand-size: clamp(
        22px,
        4.4vw,
        46px
    );

    --logo-size: clamp(
        56px,
        7vw,
        72px
    );

    --loader-width: min(
        280px,
        calc(100vw - 48px)
    );
}


/* =========================================================
   SPLASH
========================================================= */

.splash {

    position: fixed;

    inset: 0;

    z-index: 9999;

    width: 100%;
    height: 100dvh;

    min-height: 100svh;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(184,134,50,.16),
            transparent 22%
        ),

        radial-gradient(
            circle at 50% 50%,
            #10283b 0%,
            #071827 38%,
            #04111d 72%,
            #02080e 100%
        );

    transition:
        opacity 1.4s cubic-bezier(.77,0,.18,1),
        transform 1.4s cubic-bezier(.77,0,.18,1);
}


.splash.hide {

    opacity: 0;

    transform: scale(1.18);

    pointer-events: none;
}


/* =========================================================
   CANVAS
========================================================= */

#particles {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.glow {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(70vw, 600px);

    height:
        min(70vw, 600px);

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(184,134,50,.17),
            rgba(184,134,50,.05) 35%,
            transparent 70%
        );

    filter: blur(15px);

    animation:
        glowPulse 4s ease-in-out infinite alternate;

    pointer-events: none;

    z-index: 2;
}


@keyframes glowPulse {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.85);

        opacity: .55;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1.2);

        opacity: 1;
    }
}


/* =========================================================
   TOP / BOTTOM DECORATION
========================================================= */

.top-line,
.bottom-line {

    position: absolute;

    left: 50%;

    width: 1px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(215,173,91,.5),
            transparent
        );

    opacity: .6;

    z-index: 3;
}


.top-line {

    top: 0;

    height:
        clamp(70px, 17vh, 180px);
}


.bottom-line {

    bottom: 0;

    height:
        clamp(70px, 17vh, 180px);
}


/* =========================================================
   3D WORLD
========================================================= */

.world {

    position: relative;

    flex: 0 0 auto;

    width: var(--world-size);
    height: var(--world-size);

    max-width: 620px;
    max-height: 620px;

    perspective:
        clamp(
            700px,
            12vw,
            1300px
        );

    transform-style: preserve-3d;

    transform:
        rotateX(var(--mouseY, 0deg))
        rotateY(var(--mouseX, 0deg));

    transition:
        transform .25s ease-out;

    z-index: 5;

    animation:
        worldIntro
        2.2s
        cubic-bezier(.16,1,.3,1);
}


@keyframes worldIntro {

    0% {

        opacity: 0;

        transform:
            scale(.1)
            rotateX(75deg)
            rotateY(70deg);
    }

    55% {

        opacity: 1;

        transform:
            scale(1.08)
            rotateX(-8deg)
            rotateY(-10deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotateX(0deg)
            rotateY(0deg);
    }
}


/* =========================================================
   GOLD 3D RINGS
========================================================= */

.ring {

    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    border:
        1px solid
        rgba(215,173,91,.65);

    transform-style: preserve-3d;

    box-shadow:
        0 0 15px rgba(184,134,50,.25),
        inset 0 0 15px rgba(184,134,50,.1);
}


.ring::before,
.ring::after {

    content: "";

    position: absolute;

    width:
        clamp(5px, .7vw, 8px);

    height:
        clamp(5px, .7vw, 8px);

    border-radius: 50%;

    background:
        var(--gold-bright);

    box-shadow:
        0 0 8px var(--gold-light),
        0 0 22px var(--gold),
        0 0 45px rgba(184,134,50,.8);
}


/* =========================================================
   RING SIZES
========================================================= */

.ring.one {

    width: 46.7%;
    height: 46.7%;

    min-width: 150px;
    min-height: 150px;

    transform:
        translate(-50%,-50%)
        rotateX(70deg);

    animation:
        ringOne
        7s
        linear
        infinite;
}


.ring.one::before {

    left: 50%;
    top: -4px;
}


.ring.two {

    width: 58.3%;
    height: 58.3%;

    min-width: 185px;
    min-height: 185px;

    border-color:
        rgba(255,255,255,.2);

    transform:
        translate(-50%,-50%)
        rotateY(70deg)
        rotateZ(20deg);

    animation:
        ringTwo
        10s
        linear
        infinite;
}


.ring.two::after {

    right: 12%;
    bottom: 15%;
}


.ring.three {

    width: 71.7%;
    height: 71.7%;

    min-width: 220px;
    min-height: 220px;

    border-color:
        rgba(215,173,91,.25);

    transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateY(25deg);

    animation:
        ringThree
        14s
        linear
        infinite;
}


.ring.four {

    width: 38.3%;
    height: 38.3%;

    min-width: 125px;
    min-height: 125px;

    border-color:
        rgba(240,207,131,.45);

    transform:
        translate(-50%,-50%)
        rotateY(75deg)
        rotateX(30deg);

    animation:
        ringFour
        6s
        linear
        infinite
        reverse;
}


/* =========================================================
   RING ANIMATIONS
========================================================= */

@keyframes ringOne {

    from {

        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(360deg);
    }
}


@keyframes ringTwo {

    from {

        transform:
            translate(-50%,-50%)
            rotateY(70deg)
            rotateZ(20deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateY(70deg)
            rotateZ(380deg);
    }
}


@keyframes ringThree {

    from {

        transform:
            translate(-50%,-50%)
            rotateX(65deg)
            rotateY(25deg)
            rotateZ(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateX(65deg)
            rotateY(25deg)
            rotateZ(360deg);
    }
}


@keyframes ringFour {

    from {

        transform:
            translate(-50%,-50%)
            rotateY(75deg)
            rotateX(30deg)
            rotateZ(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotateY(75deg)
            rotateX(30deg)
            rotateZ(360deg);
    }
}


/* =========================================================
   CENTRAL GOLD CORE
========================================================= */

.core {

    position: absolute;

    left: 50%;
    top: 50%;

    width: var(--core-size);
    height: var(--core-size);

    transform:
        translate(-50%,-50%)
        translateZ(90px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff6d7 0%,
            #f0cf83 8%,
            #d7ad5b 20%,
            #b88632 38%,
            #704816 62%,
            #27190a 83%,
            #080503 100%
        );

    box-shadow:

        0 0 20px
            rgba(240,207,131,.8),

        0 0 55px
            rgba(184,134,50,.65),

        0 0 100px
            rgba(184,134,50,.35),

        0 0 160px
            rgba(184,134,50,.15),

        inset -25px -30px 45px
            rgba(0,0,0,.75);

    z-index: 10;

    transform-style: preserve-3d;

    animation:
        coreFloat
        4s
        ease-in-out
        infinite,

        coreLight
        2.5s
        ease-in-out
        infinite
        alternate;
}


.core::before {

    content: "";

    position: absolute;

    inset:
        clamp(8px, 1.2vw, 13px);

    border-radius: 50%;

    border:
        1px solid
        rgba(255,244,205,.8);

    box-shadow:

        inset 0 0 25px
            rgba(255,240,190,.45),

        0 0 20px
            rgba(255,220,130,.3);
}


.core::after {

    content: "";

    position: absolute;

    inset:
        clamp(-55px, -7vw, -35px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(184,134,50,.35),
            transparent 65%
        );

    filter: blur(20px);

    z-index: -1;
}


@keyframes coreFloat {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            translateZ(80px)
            rotateX(0deg)
            rotateY(0deg);
    }

    50% {

        transform:
            translate(-50%,-58%)
            translateZ(110px)
            rotateX(12deg)
            rotateY(-12deg);
    }
}


@keyframes coreLight {

    from {
        filter: brightness(.85);
    }

    to {
        filter: brightness(1.35);
    }
}


/* =========================================================
   ORBITS
========================================================= */

.orbit {

    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    transform-style: preserve-3d;
}


.orbit span {

    position: absolute;

    width:
        clamp(6px, .8vw, 9px);

    height:
        clamp(6px, .8vw, 9px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff8dd,
            var(--gold)
        );

    box-shadow:

        0 0 8px #fff2bd,

        0 0 20px var(--gold-light),

        0 0 45px var(--gold);
}


.orbit.a {

    width: 76.7%;
    height: 76.7%;

    min-width: 240px;
    min-height: 240px;

    transform:
        translate(-50%,-50%);

    animation:
        orbitA
        7s
        linear
        infinite;
}


.orbit.a span {

    top: -5px;
    left: 50%;
}


.orbit.b {

    width: 58.3%;
    height: 58.3%;

    min-width: 185px;
    min-height: 185px;

    transform:
        translate(-50%,-50%);

    animation:
        orbitB
        5s
        linear
        infinite
        reverse;
}


.orbit.b span {

    right: -5px;
    top: 30%;
}


.orbit.c {

    width: 85%;
    height: 85%;

    min-width: 265px;
    min-height: 265px;

    transform:
        translate(-50%,-50%);

    animation:
        orbitC
        12s
        linear
        infinite;
}


.orbit.c span {

    bottom: -5px;
    left: 15%;
}


/* =========================================================
   ORBIT ANIMATIONS
========================================================= */

@keyframes orbitA {

    to {

        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(360deg);
    }
}


@keyframes orbitB {

    to {

        transform:
            translate(-50%,-50%)
            rotateY(70deg)
            rotateZ(360deg);
    }
}


@keyframes orbitC {

    to {

        transform:
            translate(-50%,-50%)
            rotateX(60deg)
            rotateY(30deg)
            rotateZ(360deg);
    }
}


/* =========================================================
   CENTER LOGO
========================================================= */

.logo {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        translateZ(170px);

    width:
        min(90%, 560px);

    z-index: 30;

    text-align: center;

    pointer-events: none;
}


/* =========================================================
   LOGO SYMBOL
========================================================= */

.logo-symbol {

    width: var(--logo-size);
    height: var(--logo-size);

    margin:
        0 auto clamp(10px, 1.8vw, 18px);

    border-radius:
        clamp(14px, 2vw, 18px);

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.28),
            rgba(255,255,255,.04)
        );

    border:
        1px solid
        rgba(240,207,131,.6);

    box-shadow:

        0 12px 50px
            rgba(184,134,50,.5),

        inset 0 1px 2px
            rgba(255,255,255,.7);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    animation:
        symbolReveal
        1.5s
        cubic-bezier(.16,1,.3,1)
        .8s
        backwards;
}


.logo-symbol span {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(30px, 4.2vw, 43px);

    font-weight: bold;

    color:
        var(--gold-bright);

    text-shadow:

        0 0 8px
            rgba(240,207,131,.7),

        0 0 25px
            rgba(184,134,50,.8);
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        var(--brand-size);

    font-weight: bold;

    letter-spacing:
        clamp(4px, 1vw, 10px);

    line-height: 1.15;

    color:
        var(--cream);

    white-space: nowrap;

    text-shadow:

        0 2px 8px
            rgba(0,0,0,.8),

        0 0 25px
            rgba(184,134,50,.35);

    animation:
        brandReveal
        1.8s
        cubic-bezier(.16,1,.3,1)
        1.2s
        backwards;
}


.tagline {

    margin-top:
        clamp(8px, 1.4vw, 13px);

    font-size:
        clamp(6px, 1vw, 9px);

    letter-spacing:
        clamp(2px, .8vw, 7px);

    line-height: 1.4;

    color:
        rgba(240,207,131,.75);

    animation:
        taglineReveal
        1.4s
        ease
        2.3s
        backwards;
}


/* =========================================================
   LOGO ANIMATIONS
========================================================= */

@keyframes symbolReveal {

    from {

        opacity: 0;

        transform:
            translateY(50px)
            scale(.2)
            rotateX(80deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }
}


@keyframes brandReveal {

    from {

        opacity: 0;

        letter-spacing: 35px;

        filter: blur(20px);

        transform:
            translateY(30px);
    }

    to {

        opacity: 1;

        letter-spacing:
            clamp(4px, 1vw, 10px);

        filter: blur(0);

        transform:
            translateY(0);
    }
}


@keyframes taglineReveal {

    from {

        opacity: 0;

        letter-spacing: 20px;
    }

    to {

        opacity: 1;

        letter-spacing:
            clamp(2px, .8vw, 7px);
    }
}


/* =========================================================
   SIDE HUD
========================================================= */

.hud {

    position: absolute;

    inset:
        clamp(14px, 2.2vw, 28px);

    pointer-events: none;

    opacity: .6;

    z-index: 8;
}


.corner {

    position: absolute;

    width:
        clamp(32px, 4vw, 50px);

    height:
        clamp(32px, 4vw, 50px);

    border:
        1px solid
        rgba(215,173,91,.35);
}


.corner.tl {

    top: 0;
    left: 0;

    border-right: 0;
    border-bottom: 0;
}


.corner.tr {

    top: 0;
    right: 0;

    border-left: 0;
    border-bottom: 0;
}


.corner.bl {

    bottom: 0;
    left: 0;

    border-right: 0;
    border-top: 0;
}


.corner.br {

    bottom: 0;
    right: 0;

    border-left: 0;
    border-top: 0;
}


.hud-text {

    position: absolute;

    font-size:
        clamp(5px, .7vw, 7px);

    letter-spacing:
        clamp(1.5px, .35vw, 3px);

    color:
        rgba(240,207,131,.45);

    white-space: nowrap;
}


.hud-top {

    top:
        clamp(7px, 1vw, 10px);

    left:
        clamp(45px, 5vw, 65px);
}


.hud-bottom {

    right:
        clamp(45px, 5vw, 65px);

    bottom:
        clamp(7px, 1vw, 10px);
}


/* =========================================================
   LOADER
========================================================= */

.loader {

    position: absolute;

    left: 50%;

    bottom:
        max(
            env(safe-area-inset-bottom),
            clamp(35px, 6vh, 62px)
        );

    transform:
        translateX(-50%);

    width:
        var(--loader-width);

    max-width:
        calc(100vw - 48px);

    text-align: center;

    z-index: 100;
}


.loader-title {

    font-size:
        clamp(7px, 1vw, 9px);

    letter-spacing:
        clamp(2px, .6vw, 4px);

    line-height: 1.4;

    color:
        rgba(245,241,232,.55);

    margin-bottom:
        clamp(8px, 1.5vw, 12px);

    animation:
        blink
        1.3s
        ease-in-out
        infinite
        alternate;
}


.loader-bar {

    position: relative;

    width: 100%;

    height:
        clamp(2px, .3vw, 3px);

    background:
        rgba(255,255,255,.12);

    overflow: hidden;

    border-radius: 10px;
}


.loader-progress {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            var(--gold-bright),
            var(--gold),
            transparent
        );

    box-shadow:
        0 0 12px var(--gold-light),
        0 0 25px var(--gold);

    animation:
        progress
        6.8s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


.loader-percent {

    margin-top:
        clamp(6px, 1vw, 9px);

    font-size:
        clamp(6px, .8vw, 8px);

    letter-spacing:
        clamp(1.5px, .5vw, 3px);

    color:
        rgba(240,207,131,.5);
}


@keyframes progress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}


@keyframes blink {

    from {
        opacity: .3;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 480px) {

    :root {

        --world-size:
            min(
                88vw,
                58vh,
                410px
            );
    }


    .brand {

        white-space: normal;

        font-size:
            clamp(
                20px,
                7vw,
                30px
            );

        letter-spacing:
            clamp(
                3px,
                1.3vw,
                6px
            );

        line-height: 1.1;
    }


    .tagline {

        font-size: 6px;

        letter-spacing:
            clamp(
                2px,
                1vw,
                4px
            );
    }


    .loader {

        width:
            min(
                210px,
                calc(100vw - 48px)
            );
    }


    .hud-text {

        display: none;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 360px) {

    :root {

        --world-size:
            min(
                88vw,
                52vh,
                340px
            );
    }


    .ring.one {

        min-width: 125px;
        min-height: 125px;
    }


    .ring.two {

        min-width: 155px;
        min-height: 155px;
    }


    .ring.three {

        min-width: 190px;
        min-height: 190px;
    }


    .ring.four {

        min-width: 105px;
        min-height: 105px;
    }


    .orbit.a {

        min-width: 205px;
        min-height: 205px;
    }


    .orbit.b {

        min-width: 155px;
        min-height: 155px;
    }

    <script>

        /* =====================================================
           FRAME REFERENCES
        ===================================================== */

        const homeFrame =
            document.getElementById("homeFrame");

        const aboutFrame =
            document.getElementById("aboutFrame");

        const servicesFrame =
            document.getElementById("servicesFrame");

        const journeyFrame =
            document.getElementById("journeyFrame");

        const projectsFrame =
            document.getElementById("projectsFrame");

        const chooseFrame =
            document.getElementById("chooseFrame");

        const contactFrame =
            document.getElementById("contactFrame");


        /* =====================================================
           TARGET MAP

           All possible names are supported.
        ===================================================== */

        const targets = {

            /* HOME */

            home: homeFrame,
            index: homeFrame,
            hero: homeFrame,
            top: homeFrame,


            /* ABOUT */

            about: aboutFrame,
            "about-me": aboutFrame,
            aboutme: aboutFrame,


            /* SERVICES */

            service: servicesFrame,
            services: servicesFrame,


            /* JOURNEY / QUALIFICATION */

            journey: journeyFrame,
            "my-journey": journeyFrame,
            myjourney: journeyFrame,

            qualification: journeyFrame,
            qualifications: journeyFrame,

            study: journeyFrame,
            education: journeyFrame,


            /* PROJECTS */

            project: projectsFrame,
            projects: projectsFrame,


            /* WHY CHOOSE ME */

            choose: chooseFrame,
            "why-choose": chooseFrame,
            whychoose: chooseFrame,

            "why-choose-me": chooseFrame,
            whychooseme: chooseFrame,


            /* CONTACT */

            contact: contactFrame

        };


        /* =====================================================
           NORMALIZE HASH
        ===================================================== */

        function normalizeHash(value) {

            if (!value) {
                return "";
            }

            return value
                .replace(/^#/, "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "-");

        }


        /* =====================================================
           GET TARGET FRAME
        ===================================================== */

        function getTargetFrame(hash) {

            const target =
                normalizeHash(hash);

            if (!target) {
                return null;
            }

            return targets[target] || null;

        }


        /* =====================================================
           SCROLL TO FRAME
        ===================================================== */

        function scrollToFrame(frame, smooth = true) {

            if (!frame) {
                return;
            }


            const frameTop =
                frame.getBoundingClientRect().top +
                window.scrollY;


            window.scrollTo({

                top: Math.max(0, frameTop),

                behavior:
                    smooth ? "smooth" : "auto"

            });

        }


        /* =====================================================
           HANDLE MENU LINK

           This function runs inside HOME iframe.
        ===================================================== */

        function handleMenuLink(event) {

            const link =
                event.target.closest("a");


            if (!link) {
                return;
            }


            const href =
                link.getAttribute("href");


            if (!href) {
                return;
            }


            /*
             * Only process hash links.
             */

            if (!href.startsWith("#")) {
                return;
            }


            const frame =
                getTargetFrame(href);


            /*
             * If it is not one of our portfolio
             * section links, leave it alone.
             */

            if (!frame) {
                return;
            }


            /*
             * IMPORTANT:
             * Stop the iframe from trying to
             * scroll inside itself.
             */

            event.preventDefault();
            event.stopPropagation();


            /*
             * Scroll the MAIN index.html.
             */

            scrollToFrame(frame, true);


            /*
             * Update URL.
             */

            const cleanHash =
                normalizeHash(href);


            history.pushState(
                null,
                "",
                "#" + cleanHash
            );

        }


        /* =====================================================
           CONNECT HOME HEADER MENU
        ===================================================== */

        function connectHomeMenu() {

            try {

                const doc =
                    homeFrame.contentDocument ||
                    homeFrame.contentWindow.document;


                if (!doc) {
                    return;
                }


                /*
                 * Prevent duplicate listeners.
                 */

                if (
                    doc.documentElement.dataset
                        .indexMenuConnected === "true"
                ) {
                    return;
                }


                doc.documentElement.dataset
                    .indexMenuConnected = "true";


                /*
                 * Capture mode is intentional.
                 *
                 * It allows index.html to control
                 * the navigation before the original
                 * home.html navigation runs.
                 */

                doc.addEventListener(
                    "click",
                    handleMenuLink,
                    true
                );


            } catch (error) {

                console.error(
                    "Home menu connection failed:",
                    error
                );

            }

        }


        /* =====================================================
           CALCULATE IFRAME HEIGHT
        ===================================================== */

        function updateFrameHeight(frame) {

            if (!frame) {
                return;
            }


            try {

                const doc =
                    frame.contentDocument ||
                    frame.contentWindow.document;


                if (!doc) {
                    return;
                }


                const html =
                    doc.documentElement;

                const body =
                    doc.body;


                if (!html) {
                    return;
                }


                const height =
                    Math.max(

                        html.scrollHeight,

                        html.offsetHeight,

                        html.clientHeight,

                        body
                            ? body.scrollHeight
                            : 0,

                        body
                            ? body.offsetHeight
                            : 0,

                        body
                            ? body.clientHeight
                            : 0

                    );


                /*
                 * Add a tiny safety margin so
                 * the bottom of animated sections
                 * doesn't get clipped.
                 */

                frame.style.height =
                    Math.max(height, 100) + "px";


                frame.style.minHeight =
                    Math.max(height, 100) + "px";


            } catch (error) {

                console.warn(
                    "Frame height error:",
                    error
                );

            }

        }


        /* =====================================================
           UPDATE ALL FRAME HEIGHTS
        ===================================================== */

        function updateAllFrames() {

            updateFrameHeight(homeFrame);

            updateFrameHeight(aboutFrame);

            updateFrameHeight(servicesFrame);

            updateFrameHeight(journeyFrame);

            updateFrameHeight(projectsFrame);

            updateFrameHeight(chooseFrame);

            updateFrameHeight(contactFrame);

        }


        /* =====================================================
           MONITOR FRAME
        ===================================================== */

        function monitorFrame(frame) {

            if (!frame) {
                return;
            }


            /*
             * Some sections contain images,
             * fonts, animations or 3D elements.
             *
             * Therefore height is checked several times.
             */

            const delays = [
                50,
                150,
                300,
                600,
                1000,
                1500,
                2500
            ];


            delays.forEach(function(delay) {

                setTimeout(function() {

                    updateFrameHeight(frame);

                }, delay);

            });


            /*
             * Home contains the header.
             */

            if (frame === homeFrame) {

                setTimeout(
                    connectHomeMenu,
                    100
                );

            }

        }


        /* =====================================================
           FRAME LOAD
        ===================================================== */

        const allFrames = [

            homeFrame,
            aboutFrame,
            servicesFrame,
            journeyFrame,
            projectsFrame,
            chooseFrame,
            contactFrame

        ];


        allFrames.forEach(function(frame) {

            frame.addEventListener(
                "load",
                function() {

                    updateFrameHeight(frame);

                    monitorFrame(frame);

                }
            );

        });


        /* =====================================================
           RESIZE
        ===================================================== */

        let resizeTimer = null;


        window.addEventListener(
            "resize",
            function() {

                clearTimeout(resizeTimer);


                resizeTimer =
                    setTimeout(
                        function() {

                            updateAllFrames();

                        },
                        150
                    );

            }
        );


        /* =====================================================
           BACK TO TOP
        ===================================================== */

        const backToTop =
            document.getElementById("backToTop");


        window.addEventListener(
            "scroll",
            function() {

                if (window.scrollY > 500) {

                    backToTop.classList.add(
                        "visible"
                    );

                } else {

                    backToTop.classList.remove(
                        "visible"
                    );

                }

            }
        );


        backToTop.addEventListener(
            "click",
            function() {

                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });


                /*
                 * Remove hash.
                 */

                history.pushState(
                    null,
                    "",
                    window.location.pathname +
                    window.location.search
                );

            }
        );


        /* =====================================================
           DIRECT URL HASH

           Example:

           index.html#about
           index.html#journey
           index.html#projects
        ===================================================== */

        function handleCurrentHash() {

            const hash =
                window.location.hash;


            if (!hash) {
                return;
            }


            const frame =
                getTargetFrame(hash);


            if (!frame) {
                return;
            }


            /*
             * Wait for iframe heights.
             */

            setTimeout(
                function() {

                    scrollToFrame(
                        frame,
                        false
                    );

                },
                700
            );

        }


        /* =====================================================
           BROWSER BACK / FORWARD
        ===================================================== */

        window.addEventListener(
            "popstate",
            function() {

                const hash =
                    window.location.hash;


                if (!hash) {

                    window.scrollTo({

                        top: 0,

                        behavior: "smooth"

                    });

                    return;

                }


                const frame =
                    getTargetFrame(hash);


                if (frame) {

                    scrollToFrame(
                        frame,
                        true
                    );

                }

            }
        );


        /* =====================================================
           INITIAL PAGE LOAD
        ===================================================== */

        window.addEventListener(
            "load",
            function() {

                /*
                 * Initial measurements.
                 */

                updateAllFrames();


                /*
                 * Connect Home menu.
                 */

                setTimeout(
                    connectHomeMenu,
                    300
                );


                /*
                 * Handle direct hash.
                 */

                handleCurrentHash();

            }
        );

/* =====================================================
   RECEIVE NAVIGATION FROM HOME.HTML
===================================================== */

window.addEventListener("message", function(event) {

    if (!event.data) return;

    if (event.data.type !== "portfolio-navigation") {
        return;
    }

    let target = String(
        event.data.target || ""
    )
    .replace(/^#/, "")
    .trim()
    .toLowerCase();


    /* =================================================
       HOME
    ================================================= */

    if (
        target === "" ||
        target === "home" ||
        target === "hero" ||
        target === "index" ||
        target === "top"
    ) {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        history.replaceState(
            null,
            "",
            window.location.pathname +
            window.location.search
        );

        return;
    }


    /* =================================================
       OTHER SECTIONS
    ================================================= */

    const frame = targets[target];

    if (!frame) {
        return;
    }


    const frameTop =
        frame.getBoundingClientRect().top +
        window.scrollY;


    window.scrollTo({
        top: Math.max(0, frameTop),
        behavior: "smooth"
    });


    history.pushState(
        null,
        "",
        "#" + target
    );

});



    </script>

    <script>

    (() => {
/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

const world =
    document.getElementById("world");

const splash =
    document.getElementById("splash");

const percent =
    document.getElementById("percent");


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

let width = window.innerWidth;

let height = window.innerHeight;

let particles = [];

let animationFrame;
let worldAnimationFrame;
let splashFinished = false;


/* =========================================================
   DEVICE PIXEL RATIO
========================================================= */

function getDPR() {

    return Math.min(
        window.devicePixelRatio || 1,
        2
    );

}


/* =========================================================
   PARTICLE COUNT
========================================================= */

function getParticleCount() {

    const area =
        window.innerWidth *
        window.innerHeight;

    if (window.innerWidth <= 480) {

        return 60;

    }

    if (window.innerWidth <= 1024) {

        return 100;

    }

    if (area >= 3000000) {

        return 190;

    }

    return 150;

}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const dpr =
        getDPR();


    canvas.width =
        Math.floor(width * dpr);

    canvas.height =
        Math.floor(height * dpr);


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    /*
       Important:
       Reset transform before scaling.
       This prevents repeated resize scaling.
    */

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    createParticles();

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* =========================================================
   CREATE PARTICLES
========================================================= */

function createParticles() {

    particles = [];

    const count =
        getParticleCount();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        particles.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            size:
                .4 +
                Math.random() *
                2.2,

            speedX:
                (Math.random() - .5) *
                .25,

            speedY:
                (Math.random() - .5) *
                .25,

            alpha:
                .15 +
                Math.random() *
                .65,

            gold:
                Math.random() >
                .25

        });

    }

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for (
        const p of particles
    ) {

        p.x += p.speedX;

        p.y += p.speedY;


        if (
            p.x < -5
        ) {

            p.x = width + 5;

        }


        if (
            p.x > width + 5
        ) {

            p.x = -5;

        }


        if (
            p.y < -5
        ) {

            p.y = height + 5;

        }


        if (
            p.y > height + 5
        ) {

            p.y = -5;

        }


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        if (p.gold) {

            ctx.fillStyle =
                `rgba(
                    215,
                    173,
                    91,
                    ${p.alpha}
                )`;

            ctx.shadowColor =
                "rgba(184,134,50,.7)";

        } else {

            ctx.fillStyle =
                `rgba(
                    245,
                    241,
                    232,
                    ${p.alpha * .55}
                )`;

            ctx.shadowColor =
                "rgba(255,255,255,.3)";

        }


        ctx.shadowBlur = 8;

        ctx.fill();

    }


    animationFrame =
        requestAnimationFrame(
            drawParticles
        );

}


drawParticles();


/* =========================================================
   3D PARALLAX
========================================================= */

let targetX = 0;

let targetY = 0;

let currentX = 0;

let currentY = 0;


function updateWorldRotation() {

    currentX +=
        (targetX - currentX) *
        .08;

    currentY +=
        (targetY - currentY) *
        .08;


    world.style.setProperty(
        "--mouseX",
        currentX + "deg"
    );


    world.style.setProperty(
        "--mouseY",
        currentY + "deg"
    );


    worldAnimationFrame = requestAnimationFrame(updateWorldRotation);

}


updateWorldRotation();


/* =========================================================
   MOUSE PARALLAX
========================================================= */

window.addEventListener(
    "mousemove",
    event => {

        if (
            window.innerWidth <= 700
        ) {

            return;

        }


        targetX =
            (
                event.clientX /
                window.innerWidth
                - .5
            ) * 14;


        targetY =
            (
                event.clientY /
                window.innerHeight
                - .5
            ) * -14;

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH PARALLAX
========================================================= */

window.addEventListener(
    "touchmove",
    event => {

        if (
            !event.touches.length
        ) {

            return;

        }


        const touch =
            event.touches[0];


        targetX =
            (
                touch.clientX /
                window.innerWidth
                - .5
            ) * 10;


        targetY =
            (
                touch.clientY /
                window.innerHeight
                - .5
            ) * -10;

    },
    {
        passive: true
    }
);


/* =========================================================
   RESET PARALLAX
========================================================= */

window.addEventListener(
    "mouseleave",
    () => {

        targetX = 0;

        targetY = 0;

    }
);


/* =========================================================
   LOADING
========================================================= */

const start =
    performance.now();


const duration =
    6800;

function updateProgress(time) {

    if (splashFinished) {

        return;

    }


    const elapsed =
        time - start;


    const progress =
        Math.min(
            elapsed / duration,
            1
        );


    const value =
        Math.floor(
            progress * 100
        );


    percent.textContent =
        value + "%";


    if (
        progress < 1
    ) {

        requestAnimationFrame(
            updateProgress
        );

    } else {

        percent.textContent =
            "100%";


        finishSplash();

    }

}


requestAnimationFrame(
    updateProgress
);


/* =========================================================
   FINISH SPLASH
========================================================= */

function finishSplash() {

    if (splashFinished) {

        return;

    }


    splashFinished = true;


    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
    }

    if (worldAnimationFrame) {
        cancelAnimationFrame(worldAnimationFrame);
    }

    splash.classList.add(
        "hide"
    );


    setTimeout(
        () => {

            splash.style.display =
                "none";

        },
        1500
    );

}


/* =========================================================
   ESCAPE = SKIP
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            finishSplash();

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );

        }

        if (worldAnimationFrame) {

            cancelAnimationFrame(worldAnimationFrame);

        }

    }
);
    })();
    </script>
